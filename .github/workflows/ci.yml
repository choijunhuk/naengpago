name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # TODO(#마감): 샌드박스 밖에서 Expo lockfile을 갱신한 뒤 npm ci로 되돌린다.
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:app
      - run: npm run lint
      - run: npm test
      - run: npm run export:web
      - run: npm run seed:validate
      - run: npm run seed:generate
      - name: Verify generated seed files are committed
        run: git diff --exit-code -- supabase/seed supabase/seed.sql

      - run: npx supabase start
      - run: npm run db:reset
      - run: npm run db:test
      - name: Generate database types
        run: npm run db:types
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
